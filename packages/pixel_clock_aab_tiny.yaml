globals:
  # aab = auto-adjustable brightness
  - id: aab_max
    type: int
    initial_value: '220'

  - id: aab_min
    type: int
    initial_value: '25'

switch:
  - platform: template
    name: "Auto-Adjust Brightness"
    id: switch_autobrightness
    icon: mdi:brightness-auto
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

sensor:
  - platform: adc
    id: !extend light_sensor
    on_value:
      then:
        - lambda: |-
            if (id(switch_autobrightness).state) {
              // Practical upper illumination threshold for maximum brightness
              const float adc_max_lux = 600.0f;
              // Sensitivity multiplier and non-linear response curve (awtrix-ng style)
              const float factor = 1.0f;
              const float curve_gamma = 1.8f;

              int min_br = id(rgb8x32)->night_mode ? id(aab_min) : (id(aab_min) - 5);
              if (min_br < 1) min_br = 1;
              int max_br = id(aab_max);
              if (max_br < min_br) max_br = min_br;

              // Normalize sensor reading to [0.0, 1.0] and apply gamma curve
              float level = std::clamp((x / adc_max_lux) * factor, 0.0f, 1.0f);
              float curved = powf(level, curve_gamma);

              // Map non-linearly into [min_br, max_br]
              int raw_n = (int)lroundf(min_br + curved * (max_br - min_br));
              int n = std::clamp(raw_n, min_br, max_br);

              int c = id(rgb8x32)->get_brightness();
              // Fixed hysteresis in brightness steps prevents low-light jitter
              if (abs(n - c) >= 2) {
                id(rgb8x32)->set_brightness(n);
              }
            }
